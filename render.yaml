# Render Blueprint: MDSS REST API.
# Render dashboard -> New -> Blueprint -> this repo picks it up automatically,
# or configure the same values by hand (see README "Deploy on Render").
services:
  - type: web
    name: mdds-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      # Provided by Render; keep in sync with the Atlas connection string.
      - key: MONGODB_URI
        sync: false
      # Auto-generated strong secret (view/copy in the dashboard if needed).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated allowed web origins (Vercel domain + localhost dev).
      # Native mobile / ESP32 requests send no Origin header and are always allowed.
      # Replace the Vercel domain with your actual deployment URL.
      - key: CORS_ORIGINS
        value: "https://your-mdss-app.vercel.app,http://localhost:3000,http://localhost:8081"
      # PORT is injected automatically by Render.
      - key: NODE_VERSION
        value: 22.14.0
      # Firebase Admin SDK environment variables (set these in Render dashboard)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
